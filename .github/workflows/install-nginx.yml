name: Install nginx
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: environment
        default: "test"
      config-repo-branch:
        description: "Branch or tag of CI-repo"
        required: true
        default: "master"
jobs:
  log-parameters:
    if: github.repository != 'tmfg/digitraffic-road'
    runs-on: ubuntu-26.04
    steps:
      - name: Log workflow inputs
        uses: tmfg/digitraffic-actions@24e33d7e6d14273dde9094c5172e8b440a70440c # log-workflow-inputs/v1
        with:
          inputs: ${{ toJSON(inputs) }}
      - name: Create parameters.txt
        run: |
          echo "User ${{ github.actor }} started install on $(date)" > parameters.txt
          echo "Environment ${{ github.event.inputs.env }}" >> parameters.txt
          echo "config-repo-branch ${{ github.event.inputs.config-repo-branch }}" >> parameters.txt
      - name: Upload parameters.txt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parameters.txt
          path: parameters.txt
  image:
    if: github.repository != 'tmfg/digitraffic-road'
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
      actions: read
    environment: ${{ github.event.inputs.env }}
    steps:
      - name: Checkout CI-repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.CONFIG_REPO_NAME }}
          ssh-key: ${{ secrets.CONFIG_REPO_SSH_KEY }}
          ref: ${{ inputs.config-repo-branch }}
          path: digitraffic-ci
      - name: Check nginx configurations
        run: |
          cd digitraffic-ci/aws/nginx
          docker build -t nginx-road-${{ github.event.inputs.env }} --build-arg APPNAME=road --build-arg ENVIRONMENT=${{ github.event.inputs.env }} .
          docker run --rm -t nginx-road-${{ github.event.inputs.env }} nginx -t
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: gh-actions-install-image-road-nginx-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build image
        run: |
          cd digitraffic-ci/aws/nginx

          docker buildx build \
              --no-cache \
              --build-arg ENVIRONMENT=${{ github.event.inputs.env }} \
              --build-arg APPNAME=road \
              --platform linux/arm64 \
              --output type=docker \
              --tag ${{ secrets.ECR_URL }}/dt-road-nginx-repository:latest \
              --pull \
              --file=Dockerfile .
          docker push ${{ secrets.ECR_URL }}/dt-road-nginx-repository:latest
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_FILE_METADATA_SELECTION: "none"
        with:
          image: ${{ secrets.ECR_URL }}/dt-road-nginx-repository:latest
          format: cyclonedx-json
          output-file: nginx-sbom.json
      - name: Update nginx task-def
        id: update
        uses: tmfg/digitraffic-actions@fac53ef1caa9cb07fbb5d40c2c1c3738ffa26702 # update-task-def/v2
        with:
          task-def-file-name: road/${{ github.event.inputs.env }}-nginx
          family-name: road-${{ github.event.inputs.env }}-nginx
          image-arn: ${{ secrets.ECR_URL }}/dt-road-nginx-repository:latest
          aws-role: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          ci-repo-url: ${{ secrets.CONFIG_REPO_NAME }}
          ci-repo-branch: ${{ github.event.inputs.config-repo-branch }}
          ci-ssh-key: ${{ secrets.CONFIG_REPO_SSH_KEY }}
      - name: Update nginx service
        uses: tmfg/digitraffic-actions@565f5ac417ee66d4aee11bd40423664fd5ee82dc # ecs-service-update/v1
        with:
          aws-role: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          service-name: road-${{ github.event.inputs.env }}-nginx-service
          cluster-name: ${{ secrets.CLUSTER_NAME }}
          task-definition: road-${{ github.event.inputs.env }}-nginx
          desired-count: 1

      - name: Read SBOM config
        id: sbom-config
        run: |
          echo "config<<EOF" >> $GITHUB_OUTPUT
          cat digitraffic-ci/aws/sbom/road.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "common<<EOF" >> $GITHUB_OUTPUT
          cat digitraffic-ci/aws/sbom/config.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials for SBOM
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ fromJson(steps.sbom-config.outputs.common).sbomUploadRoleArn }}
          role-session-name: gh-actions-upload-sbom-road-nginx-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload SBOM
        run: |
          aws s3 cp nginx-sbom.json s3://${{ fromJson(steps.sbom-config.outputs.common).bucketArn }}/${{ fromJson(steps.sbom-config.outputs.config)[github.event.inputs.env]['nginx'] }}/${{ github.run_id }}-${{ github.sha }}.json

