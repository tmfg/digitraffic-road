name: Install Mosquitto
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: environment
        default: "test"
      config-repo-branch:
        description: "Branch or tag of CI-repo"
        required: true
        default: "master"
jobs:
  log-parameters:
    if: github.repository != 'tmfg/digitraffic-road'
    runs-on: ubuntu-24.04
    steps:
      - name: Log workflow inputs and environment
        run: |
          echo "## Workflow Inputs" >> $GITHUB_STEP_SUMMARY
          echo "| Name | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| env | ${{ github.event.inputs.env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| config-repo-branch | ${{ github.event.inputs.config-repo-branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      - name: Create parameters.txt
        run: |
          echo "User ${{ github.actor }} started install on $(date)" > parameters.txt
          echo "Environment ${{ github.event.inputs.env }}" >> parameters.txt
          echo "config-repo-branch ${{ github.event.inputs.config-repo-branch }}" >> parameters.txt
      - name: Upload parameters.txt
        uses: actions/upload-artifact@v7
        with:
          name: parameters.txt
          path: parameters.txt
  image:
    if: github.repository != 'tmfg/digitraffic-road'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      actions: read
    environment: ${{ github.event.inputs.env }}
    steps:
      - name: Checkout CI-repo
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ secrets.CONFIG_REPO_NAME }}
          ssh-key: ${{ secrets.CONFIG_REPO_SSH_KEY }}
          ref: ${{ inputs.config-repo-branch }}
          path: digitraffic-ci
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: gh-actions-install-image-road-mqtt-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build mqtt image
        run: |
          cd digitraffic-ci/aws/mqtt

          docker buildx build \
            --no-cache \
            --build-arg ENVIRONMENT=road \
            --platform linux/arm64 \
            --output type=docker \
            --tag ${{ secrets.ECR_URL }}/dt-road-mqtt-repository:latest \
            --pull=true \
            --file=Dockerfile .

          docker push ${{ secrets.ECR_URL }}/dt-road-mqtt-repository:latest
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 #v0.24.0
        env:
          SYFT_FILE_METADATA_SELECTION: "none"
        with:
          image: ${{ secrets.ECR_URL }}/dt-road-mosquitto-repository:latest
          format: cyclonedx-json
          output-file: mosquitto-sbom.json
      - name: Update road-mqtt task-def
        id: update
        uses: tmfg/digitraffic-actions@update-task-def/v2
        with:
          task-def-file-name: road/${{ github.event.inputs.env }}-mqtt
          family-name: road-${{ github.event.inputs.env }}-mqtt
          image-arn: ${{ secrets.ECR_URL }}/dt-road-mqtt-repository:latest
          aws-role: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          ci-repo-url: ${{ secrets.CONFIG_REPO_NAME }}
          ci-repo-branch: ${{ github.event.inputs.config-repo-branch }}
          ci-ssh-key: ${{ secrets.CONFIG_REPO_SSH_KEY }}
      - name: Update mqtt service
        uses: tmfg/digitraffic-actions@ecs-service-update/v1
        with:
          aws-role: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          service-name: road-${{ github.event.inputs.env }}-mosquitto-service
          cluster-name: ${{ secrets.CLUSTER_NAME }}
          task-definition: road-${{ github.event.inputs.env }}-mqtt
          desired-count: 1

      - name: Read SBOM config
        id: sbom-config
        run: |
          echo "config<<EOF" >> $GITHUB_OUTPUT
          cat digitraffic-ci/aws/sbom/road.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "common<<EOF" >> $GITHUB_OUTPUT
          cat digitraffic-ci/aws/sbom/config.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials for SBOM
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ fromJson(steps.sbom-config.outputs.common).sbomUploadRoleArn }}
          role-session-name: gh-actions-upload-sbom-road-mosquitto-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload SBOM
        run: |
          aws s3 cp mosquitto-sbom.json s3://${{ fromJson(steps.sbom-config.outputs.common).bucketArn }}/${{ fromJson(steps.sbom-config.outputs.config)[github.event.inputs.env]['mosquitto'] }}/${{ github.run_id }}-${{ github.sha }}.json
